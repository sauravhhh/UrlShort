<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>UrlShort — Professional URL Shortener</title>
<meta name="description" content="Shorten long URLs in one tap. Free, fast, no sign-up.">
<meta name="theme-color" content="#111111">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<script id="aclib" type="text/javascript" src="//acscdn.com/script/aclib.js"></script>
<script type="text/javascript">
    aclib.runAutoTag({
        zoneId: 'ytjgksel1s',
    });
</script>
<style>
  :root{
    --bg:#f4f5f7; --card:#ffffff; --text:#141414; --muted:#6b7280;
    --border:#e5e7eb; --accent:#4f46e5; --btn:#111111; --btn-text:#ffffff;
    --danger:#dc2626; --radius:16px; --shadow:0 1px 3px rgba(0,0,0,.06);
  }
  [data-theme="dark"]{
    --bg:#0f1115; --card:#171a21; --text:#f3f4f6; --muted:#9ca3af;
    --border:#262b36; --accent:#818cf8; --btn:#f3f4f6; --btn-text:#111111;
    --shadow:0 1px 3px rgba(0,0,0,.4);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Arial,sans-serif;
    background:var(--bg); color:var(--text); min-height:100vh;
    display:flex; flex-direction:column; align-items:center;
    transition:background .2s,color .2s;
  }
  .wrap{width:100%; max-width:560px; padding:20px 16px 40px;}
  header{display:flex; align-items:center; justify-content:space-between; margin-bottom:20px;}
  .brand{display:flex; align-items:center; gap:10px;}
  .brand img{width:36px; height:36px; border-radius:9px;}
  .brand h1{font-size:20px; margin:0; font-weight:700; letter-spacing:-.3px;}
  .icon-btn{
    background:var(--card); border:1px solid var(--border); border-radius:12px;
    width:42px; height:42px; font-size:18px; cursor:pointer; color:var(--text);
    display:flex; align-items:center; justify-content:center; box-shadow:var(--shadow);
  }
  .card{
    background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
    padding:20px; box-shadow:var(--shadow); margin-bottom:16px;
  }
  .card h2{font-size:13px; text-transform:uppercase; letter-spacing:1px; color:var(--muted); margin:0 0 12px;}
  label{display:block; font-size:14px; font-weight:600; margin-bottom:8px;}
  .input-row{display:flex; gap:8px;}
  input[type=url], input[type=text]{
    flex:1; min-width:0; padding:13px 14px; font-size:16px; border:1px solid var(--border);
    border-radius:12px; background:var(--bg); color:var(--text); outline:none;
  }
  input:focus{border-color:var(--accent);}
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    background:var(--btn); color:var(--btn-text); border:none; border-radius:12px;
    padding:13px 20px; font-size:16px; font-weight:600; cursor:pointer; min-height:48px;
  }
  .btn:active{transform:scale(.98);}
  .btn:disabled{opacity:.55; cursor:default;}
  .btn-block{width:100%; margin-top:12px;}
  .btn-ghost{background:transparent; color:var(--text); border:1px solid var(--border);}
  .btn-small{padding:9px 14px; font-size:14px; min-height:40px; border-radius:10px;}
  .spinner{
    width:18px; height:18px; border:2.5px solid rgba(255,255,255,.35);
    border-top-color:#fff; border-radius:50%; animation:spin .7s linear infinite; display:none;
  }
  [data-theme="dark"] .spinner{border-top-color:#111; border-color:rgba(0,0,0,.2);}
  .btn.loading .spinner{display:inline-block;}
  .btn.loading .btn-label{opacity:.7;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .error{
    display:none; margin-top:12px; padding:11px 14px; border-radius:12px; font-size:14px;
    background:rgba(220,38,38,.08); color:var(--danger); border:1px solid rgba(220,38,38,.25);
  }
  .error.show{display:block;}
  #resultCard{display:none;}
  #resultCard.show{display:block;}
  .short-url{
    display:block; font-size:22px; font-weight:700; color:var(--accent); text-decoration:none;
    word-break:break-all; margin:4px 0 4px;
  }
  .orig-url{font-size:13px; color:var(--muted); word-break:break-all; margin-bottom:14px;}
  .row{display:flex; gap:8px; flex-wrap:wrap;}
  .row .btn{flex:1;}
  #qrWrap{display:none; text-align:center; margin-top:14px;}
  #qrWrap.show{display:block;}
  #qrWrap img{width:180px; height:180px; border:1px solid var(--border); border-radius:12px; background:#fff;}
  .hist-head{display:flex; align-items:center; justify-content:space-between;}
  .hist-head button{background:none; border:none; color:var(--danger); font-size:13px; cursor:pointer; padding:6px;}
  #historyList{list-style:none; margin:12px 0 0; padding:0; display:flex; flex-direction:column; gap:10px;}
  #historyList li{
    border:1px solid var(--border); border-radius:12px; padding:12px 14px; background:var(--bg);
  }
  #historyList .s{font-weight:700; color:var(--accent); font-size:15px; word-break:break-all; text-decoration:none;}
  #historyList .l{font-size:12px; color:var(--muted); word-break:break-all; margin:4px 0 8px;}
  #historyList .meta{font-size:11px; color:var(--muted); margin-bottom:8px;}
  #historyList .actions{display:flex; gap:8px;}
  .empty{color:var(--muted); font-size:14px; text-align:center; padding:18px 0 6px;}
  .ad-label{font-size:10px; text-transform:uppercase; letter-spacing:1.5px; color:var(--muted); text-align:center; margin-bottom:6px;}
  .stats{display:flex; gap:12px; margin-bottom:16px;}
  .stat{flex:1; background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:14px; text-align:center; box-shadow:var(--shadow);}
  .stat .n{font-size:24px; font-weight:800;}
  .stat .t{font-size:12px; color:var(--muted); margin-top:2px;}
  footer{text-align:center; color:var(--muted); font-size:13px; margin-top:8px;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <img src="icon-192.png" alt="UrlShort icon">
      <h1>UrlShort</h1>
    </div>
    <button class="icon-btn" id="themeBtn" aria-label="Toggle theme">🌙</button>
  </header>

  <div class="stats">
    <div class="stat"><div class="n" id="statTotal">0</div><div class="t">Links shortened</div></div>
    <div class="stat"><div class="n" id="statToday">0</div><div class="t">Today</div></div>
  </div>

  <div class="card">
    <h2>Shorten a link</h2>
    <label for="urlInput">Long URL</label>
    <div class="input-row">
      <input type="url" id="urlInput" placeholder="Paste a long URL here…" autocomplete="off" inputmode="url">
    </div>
    <button class="btn btn-block" id="shortenBtn">
      <span class="spinner"></span><span class="btn-label">Shorten URL</span>
    </button>
    <div class="error" id="errorBox"></div>
  </div>

  <div class="card" id="resultCard">
    <h2>Your short link</h2>
    <a class="short-url" id="shortUrl" href="#" target="_blank" rel="noopener"></a>
    <div class="orig-url" id="origUrl"></div>
    <div class="row">
      <button class="btn btn-small" id="copyBtn">Copy</button>
      <button class="btn btn-small btn-ghost" id="qrBtn">QR code</button>
    </div>
    <div id="qrWrap"><img id="qrImg" alt="QR code"></div>
  </div>

  <div class="card" id="adCard" hidden>
    <div class="ad-label">Advertisement</div>
    <ins class="adsbygoogle" style="display:block" data-ad-format="auto" data-full-width-responsive="true"></ins>
  </div>

  <div class="card">
    <div class="hist-head">
      <h2 style="margin:0">Recent links</h2>
      <button id="clearHist">Clear all</button>
    </div>
    <ul id="historyList"></ul>
    <div class="empty" id="emptyHist">No links yet. Shorten your first URL above.</div>
  </div>

  <footer>Made with ❤️ by sauravhhh</footer>
</div>
<script src="app.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
  }
</script>
</body>
</html>
